name: Build
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches:
      - 'main'
  workflow_dispatch:
jobs:
  build:
    name: Build and deploy UI
    # Só publica se os testes passaram (ou em execução manual).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: frontend
      url: https://vagas.henriquesebastiao.com
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Publica exatamente o commit que passou nos testes.
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://vagas-api.henriquesebastiao.com' }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./frontend/out --project-name=vagas-dev-ui --branch=main
